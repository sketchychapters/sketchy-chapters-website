<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-ar="إعادة تعيين كلمة السر | Sketchy Chapters" data-en="Reset Password | Sketchy Chapters">Reset Password | Sketchy Chapters</title>
<link rel="icon" type="image/png" href="favicon w.png">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<style>
  body{font-family:'Tajawal',sans-serif;background:#08080a;color:#e0e6ed;overflow-x:hidden;min-height:100vh;}
  .gold-accent{color:#d4af37;}
  .bg-gold{background:linear-gradient(135deg,#d4af37 0%,#aa7c11 100%);}
  .glass-card{background:rgba(18,18,22,.65);backdrop-filter:blur(16px);border:1px solid rgba(212,175,55,.15);}
  input{background:rgba(0,0,0,.4);border:1px solid rgba(212,175,55,.25);}
  input:focus{outline:none;border-color:#d4af37;}
</style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center px-6 py-10">

<button onclick="toggleLanguage()" id="lang-btn" class="fixed top-5 right-5 rtl:right-auto rtl:left-5 glass-card text-amber-400 border border-amber-500/30 px-3 py-2 rounded-xl text-xs font-bold hover:bg-amber-500/10 transition flex items-center gap-1.5 z-20">
  <i class="fa-solid fa-globe text-sm"></i>
  <span id="langBtnText">العربية</span>
</button>

<div class="text-center mb-8">
  <img src="workshop.png" alt="Workshop Logo" class="h-12 w-auto object-contain mx-auto mb-2" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';">
  <span id="logo-fallback" class="hidden text-xl font-black tracking-wider text-white">SKETCHY <span class="gold-accent">CHAPTERS</span></span>
</div>

<div class="glass-card w-full max-w-md rounded-3xl p-8 md:p-10">

  <div id="loadingState" class="text-center py-6">
    <i class="fa-solid fa-spinner fa-spin gold-accent text-2xl"></i>
    <p class="text-gray-400 text-xs mt-3" data-ar="جاري التحقق من الرابط..." data-en="Verifying your link...">Verifying your link...</p>
  </div>

  <div id="invalidState" class="hidden text-center py-6">
    <i class="fa-solid fa-circle-xmark text-red-400 text-3xl mb-3"></i>
    <h1 class="text-white font-black text-lg mb-2" data-ar="رابط غير صالح" data-en="Invalid Link">Invalid Link</h1>
    <p class="text-gray-400 text-xs mb-6" data-ar="هذا الرابط منتهي الصلاحية أو مستخدم من قبل. اطلب رابطاً جديداً من صفحة تسجيل الدخول." data-en="This link has expired or already been used. Please request a new one from the login page.">This link has expired or already been used. Please request a new one from the login page.</p>
    <a href="login.html" class="inline-block bg-gold text-black font-bold text-xs px-6 py-3 rounded-xl" data-ar="الرجوع لتسجيل الدخول" data-en="Back to Login">Back to Login</a>
  </div>

  <div id="formState" class="hidden">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-black text-white mb-1" data-ar="كلمة سر جديدة" data-en="New Password">New Password</h1>
      <p id="resetForEmail" class="text-gray-400 text-xs"></p>
    </div>

    <form id="resetForm" class="space-y-4">
      <input id="newPassword" type="password" placeholder="New password (min 6 characters)" required minlength="6"
        class="w-full rounded-xl px-4 py-3 text-sm text-white">
      <input id="confirmPassword" type="password" placeholder="Confirm new password" required minlength="6"
        class="w-full rounded-xl px-4 py-3 text-sm text-white">

      <p id="errorMsg" class="text-red-400 text-xs hidden"></p>

      <button type="submit" class="w-full bg-gold text-black font-black py-3 rounded-xl text-sm hover:opacity-90 transition" data-ar="تحديث كلمة السر" data-en="Update Password">Update Password</button>
    </form>
  </div>

  <div id="successState" class="hidden text-center py-6">
    <i class="fa-solid fa-circle-check text-emerald-400 text-3xl mb-3"></i>
    <h1 class="text-white font-black text-lg mb-2" data-ar="تم التحديث!" data-en="Password Updated!">Password Updated!</h1>
    <p class="text-gray-400 text-xs mb-6" data-ar="تقدر هلق تسجل دخولك بكلمة السر الجديدة." data-en="You can now log in with your new password.">You can now log in with your new password.</p>
    <a href="login.html" class="inline-block bg-gold text-black font-bold text-xs px-6 py-3 rounded-xl" data-ar="تسجيل الدخول" data-en="Log In">Log In</a>
  </div>

</div>

<script src="firebase-init.js"></script>
<script>
let currentLang = 'en';
function toggleLanguage(){
  currentLang = currentLang === 'en' ? 'ar' : 'en';
  const htmlRoot = document.getElementById('htmlRoot');
  const langBtnText = document.getElementById('langBtnText');
  htmlRoot.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
  htmlRoot.setAttribute('lang', currentLang);
  langBtnText.innerText = currentLang === 'ar' ? 'English' : 'العربية';
  document.querySelectorAll('[data-ar]').forEach(el => {
    const t = currentLang === 'ar' ? el.getAttribute('data-ar') : el.getAttribute('data-en');
    if (t) el.innerText = t;
  });
}

let oobCode = null;

function showState(id) {
  ['loadingState', 'invalidState', 'formState', 'successState'].forEach(s => {
    document.getElementById(s).classList.toggle('hidden', s !== id);
  });
}

(async function init() {
  const params = new URLSearchParams(window.location.search);
  oobCode = params.get('oobCode');

  if (!oobCode) {
    showState('invalidState');
    return;
  }

  try {
    const email = await auth.verifyPasswordResetCode(oobCode);
    document.getElementById('resetForEmail').innerText = email;
    showState('formState');
  } catch (err) {
    showState('invalidState');
  }
})();

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('errorMsg');
  errorEl.classList.add('hidden');

  const pass1 = document.getElementById('newPassword').value;
  const pass2 = document.getElementById('confirmPassword').value;

  if (pass1 !== pass2) {
    errorEl.textContent = currentLang === 'ar' ? 'كلمتا السر غير متطابقتين.' : 'Passwords do not match.';
    errorEl.classList.remove('hidden');
    return;
  }

  try {
    await auth.confirmPasswordReset(oobCode, pass1);
    showState('successState');
  } catch (err) {
    errorEl.textContent = currentLang === 'ar' ? 'تعذر تحديث كلمة السر. جرب تطلب رابط جديد.' : 'Could not update password. Please request a new link.';
    errorEl.classList.remove('hidden');
  }
});
</script>
</body>
</html>
