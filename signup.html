<style>
  body{color-scheme:dark;font-family:'Tajawal',sans-serif;background:#08080a;color:#e0e6ed;overflow-x:hidden;min-height:100vh;}
  .gold-accent{color:#d4af37;}
  .bg-gold{background:linear-gradient(135deg,#d4af37 0%,#aa7c11 100%);}
  .glass-card{background:rgba(18,18,22,.65);backdrop-filter:blur(16px);border:1px solid rgba(212,175,55,.15);}
  input,select{background:rgba(0,0,0,.4);border:1px solid rgba(212,175,55,.25);color:#fff;}
  input:focus,select:focus{outline:none;border-color:#d4af37;}
  select option{background:#121216;color:#fff;}

  /* ===== Lamp & cord ===== */
  #lampRig{position:relative;height:170px;display:flex;flex-direction:column;align-items:center;pointer-events:none;}
  #lampWire{width:1px;height:38px;background:rgba(212,175,55,.4);}
  #lampFixture{width:64px;height:26px;border-radius:0 0 32px 32px;background:linear-gradient(180deg,#1c1c22,#0b0b0e);border:1px solid rgba(212,175,55,.4);border-top:none;box-shadow:0 4px 18px rgba(0,0,0,.6);}
  #bulb{width:14px;height:14px;border-radius:50%;background:#3a3a2f;margin-top:-4px;transition:background .6s ease, box-shadow .6s ease;}
  #bulb.lit{background:#fff6d9;box-shadow:0 0 25px 10px rgba(255,221,120,.85), 0 0 70px 35px rgba(212,175,55,.5);}
  #cordWrap{pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;margin-top:6px;}
  #cordString{width:1.5px;height:56px;background:linear-gradient(180deg, rgba(212,175,55,.7), rgba(212,175,55,.3));}
  #cordRing{width:16px;height:16px;border-radius:50%;border:2px solid #d4af37;margin-top:-2px;background:rgba(212,175,55,.15);animation:ringPulse 1.8s ease-in-out infinite;}
  #cordWrap.pulled #cordString, #cordWrap.pulled #cordRing{animation:none;}
  #cordWrap.pulled{animation:pullSwing .9s ease;}
  #cordWrap.done{cursor:default;}
  #cordWrap.done #cordRing{animation:none;opacity:.35;}

  @keyframes ringPulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.15);opacity:.7;}}
  @keyframes pullSwing{
    0%{transform:translateY(0) rotate(0deg);}
    20%{transform:translateY(22px) rotate(4deg);}
    45%{transform:translateY(4px) rotate(-3deg);}
    65%{transform:translateY(12px) rotate(2deg);}
    100%{transform:translateY(0) rotate(0deg);}
  }

  #lampGlow{position:absolute;top:0;left:50%;transform:translateX(-50%);width:640px;height:640px;
    background:radial-gradient(circle at top, rgba(212,175,55,.32), transparent 70%);
    opacity:0;transition:opacity 1.1s ease;pointer-events:none;}
  #lampGlow.lit{opacity:1;}

  #brandWrap{opacity:.18;filter:blur(2px);transition:all 1s ease;}
  #brandWrap.lit{opacity:1;filter:none;}

  #authCard{opacity:0;transform:translateY(14px);filter:blur(4px);transition:all .9s ease;pointer-events:none;}
  #authCard.revealed{opacity:1;transform:translateY(0);filter:none;pointer-events:auto;}

  #hint{transition:opacity .5s ease;}
  #hint.hide{opacity:0;}
</style>

    <div>

</div>

// ===== خانة التخصص - قائمة اقتراحات مبنية بالـ JS (بتشتغل صح عالتلفون، بعكس datalist المدمجة يلي مش موثوقة على iOS) =====
const SPECIALIZATION_LIST = [
  "Architecture", "Interior Design", "Landscape Architecture", "Urban Planning",
  "Civil Engineering", "Structural Engineering", "Mechanical Engineering", "Electrical Engineering",
  "Electronics Engineering", "Industrial Engineering", "Chemical Engineering", "Environmental Engineering",
  "Construction Management", "Architectural Engineering", "Graphic Design", "Product Design",
  "Industrial Design", "Fashion Design", "Fine Arts", "Animation",
  "Film & Video Production", "Photography", "Multimedia Design", "UI/UX Design",
  "Web Design", "Computer Science", "Information Technology", "Software Engineering",
  "Business Administration", "Marketing", "Accounting", "Finance",
  "Economics", "Management", "Human Resources", "International Business",
  "Law", "Political Science", "Psychology", "Sociology",
  "Education", "Nursing", "Medicine", "Pharmacy",
  "Dentistry", "Physical Therapy", "Nutrition & Dietetics", "Public Health",
  "Biology", "Chemistry", "Physics", "Mathematics",
  "Statistics", "Agriculture", "Journalism", "Mass Communication",
  "English Literature", "Translation", "Hospitality Management", "Tourism Management",
  "Culinary Arts", "Music", "Theater & Performing Arts"
];

const specInput = document.getElementById('specialization');
const specSuggestions = document.getElementById('specializationSuggestions');

specInput.addEventListener('input', () => {
  const query = specInput.value.trim().toLowerCase();
  if (!query) { specSuggestions.classList.add('hidden'); specSuggestions.innerHTML = ''; return; }

  const matches = SPECIALIZATION_LIST.filter(s => s.toLowerCase().includes(query)).slice(0, 8);
  if (matches.length === 0) { specSuggestions.classList.add('hidden'); specSuggestions.innerHTML = ''; return; }

  specSuggestions.innerHTML = matches.map(s =>
    `<div class="px-4 py-3 text-sm text-white hover:bg-amber-500/10 active:bg-amber-500/20 cursor-pointer border-b border-amber-500/10 last:border-0" onclick="selectSpecialization('${s.replace(/'/g, "\\'")}')">${s}</div>`
  ).join('');
  specSuggestions.classList.remove('hidden');
});

function selectSpecialization(value) {
  specInput.value = value;
  specSuggestions.classList.add('hidden');
  specSuggestions.innerHTML = '';
}

// نسكر القائمة لو دست بأي مكان تاني بالصفحة
document.addEventListener('click', (e) => {
  if (e.target !== specInput && !specSuggestions.contains(e.target)) {
    specSuggestions.classList.add('hidden');
  }
});

// ===== Lamp pull interaction (بتنطلب كل مرة يدخل فيها حدا الصفحة) =====
function pullCord(el){
  if (el.classList.contains('done')) return;
  el.classList.add('pulled');
  litLampNow();

  setTimeout(() => {
    document.getElementById('authCard').classList.add('revealed');
    el.classList.remove('pulled');
    el.classList.add('done');
  }, 550);
}

function litLampNow(){
  document.getElementById('bulb').classList.add('lit');
  document.getElementById('lampGlow').classList.add('lit');
  document.getElementById('brandWrap').classList.add('lit');
  document.getElementById('hint').classList.add('hide');
}

// ===== Language toggle (matches rest of the site) =====
let currentLang = 'en';
function toggleLanguage(){
  currentLang = currentLang === 'en' ? 'ar' : 'en';
  const htmlRoot = document.getElementById('htmlRoot');
  const langBtnText = document.getElementById('langBtnText');
  htmlRoot.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
  htmlRoot.setAttribute('lang', currentLang);
  langBtnText.innerText = currentLang === 'ar' ? 'English' : 'العربية';
  document.querySelectorAll('[data-ar]').forEach(el => {
    const t = currentLang === 'ar' ? el.getAttribute('data-ar') : el.getAttribute('data-en');
    if (t) el.innerText = t;
  });
}

// ===== Signup logic =====
document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('errorMsg');
  errorEl.classList.add('hidden');

  const btn = document.getElementById('signupSubmitBtn');
  const originalHtml = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>' + (currentLang === 'ar' ? 'جاري الإنشاء...' : 'Creating account...') + '</span>';

  try {
    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const dialCode = document.getElementById('phoneDialCode').value;
    const phoneNumber = document.getElementById('phone').value.trim();
    await signUpStudent({
      name: firstName + ' ' + lastName,
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
      birthDate: document.getElementById('birthDate').value,
      phone: dialCode + ' ' + phoneNumber,
      gender: document.querySelector('input[name="gender"]:checked')?.value || '',
      country: document.getElementById('country').value,
      region: document.getElementById('region').value.trim(),
      specialization: document.getElementById('specialization').value.trim()
    });

    const params = new URLSearchParams(window.location.search);
    const finalDestination = params.get('redirect') || 'account.html';
    window.location.href = 'referral.html?next=' + encodeURIComponent(finalDestination);
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.classList.remove('hidden');
    btn.disabled = false;
    btn.innerHTML = originalHtml;
  }
});
</script>
