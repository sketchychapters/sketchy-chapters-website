        function renderProject() {
            const params = new URLSearchParams(window.location.search);
            const projectId = params.get('id');
            const data = projectsData[projectId] || projectsData['beirut-villa'];

            const container = document.getElementById('project-container');
            
            // Build Gallery HTML
            let galleryHTML = '';
            data.gallery.forEach((imgUrl, index) => {
                galleryHTML += `
                    <div class="rounded-2xl overflow-hidden glass-card border border-amber-500/20 h-48 md:h-64 cursor-pointer hover:opacity-90 transition">
                        <img src="${imgUrl}" alt="Gallery Image ${index + 1}" class="w-full h-full object-cover" onerror="this.src='${data.fallbackImg || data.mainImage}'" onclick="changeMainImage('${imgUrl}')">
                    </div>
                `;
            });

            // Build Scope Items HTML
            let scopeEnHTML = data.scopeEn.map(item => `<li class="flex items-center gap-2"><i class="fa-solid fa-check text-amber-400 text-xs"></i> ${item}</li>`).join('');
            let scopeArHTML = data.scopeAr.map(item => `<li class="flex items-center gap-2"><i class="fa-solid fa-check text-amber-400 text-xs"></i> ${item}</li>`).join('');

            container.innerHTML = `
                <!-- Meta Tags -->
                <div class="flex flex-wrap items-center gap-3 mb-6 text-xs font-bold">
                    <span class="px-4 py-1.5 rounded-full glass-card gold-accent border border-amber-500/30 uppercase tracking-wider">
                        <i class="fa-solid fa-location-dot me-1"></i>
                        <span class="lang-en">${data.locationEn}</span>
                        <span class="lang-ar">${data.locationAr}</span>
                    </span>
                    <span class="px-4 py-1.5 rounded-full glass-card text-gray-300 border border-white/10">
                        <i class="fa-solid fa-calendar me-1 text-amber-400"></i> ${data.year}
                    </span>
                    <span class="px-4 py-1.5 rounded-full glass-card text-amber-400 border border-amber-500/20">
                        <i class="fa-solid fa-layer-group me-1"></i>
                        <span class="lang-en">${data.typeEn}</span>
                        <span class="lang-ar">${data.typeAr}</span>
                    </span>
                </div>

                <!-- Title -->
                <h1 class="text-3xl md:text-5xl font-black text-white mb-8 leading-tight">
                    <span class="lang-en">${data.titleEn}</span>
                    <span class="lang-ar">${data.titleAr}</span>
                </h1>

                <!-- Featured Main Image -->
                <div class="rounded-3xl overflow-hidden mb-8 border border-amber-500/20 shadow-2xl h-[350px] md:h-[550px] relative">
                    <img id="main-display-img" src="${data.mainImage}" alt="${data.titleEn}" class="w-full h-full object-cover transition duration-500" onerror="this.src='${data.fallbackImg || data.mainImage}'">
                </div>

                <!-- Image Gallery Grid -->

                        <span class="lang-en">Project Photo Gallery</span>
                        <span class="lang-ar">معرض صور المشروع</span>
                    </h4>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                        ${galleryHTML}
                    </div>
                </div>

                <!-- Details & Scope Section -->

                    <!-- Project Overview -->
                    <div class="lg:col-span-2 glass-card rounded-3xl p-8">
                        <h3 class="text-xl font-bold text-amber-400 mb-4 flex items-center gap-2">
                            <i class="fa-solid fa-circle-info"></i>
                            <span class="lang-en">Project Overview</span>
                            <span class="lang-ar">تفاصيل وفكرة المشروع</span>
                        </h3>
                        <p class="text-gray-300 font-light leading-relaxed text-base md:text-lg">
                            <span class="lang-en">${data.descEn}</span>
                            <span class="lang-ar">${data.descAr}</span>
                        </p>
                    </div>

                    <!-- Scope of Work -->
                    <div class="glass-card rounded-3xl p-8 border border-amber-500/30">
                        <h3 class="text-xl font-bold text-white mb-4 flex items-center gap-2">
                            <i class="fa-solid fa-list-check text-amber-400"></i>
                            <span class="lang-en">Scope of Work</span>
                            <span class="lang-ar">نطاق العمل والخدمات</span>
                        </h3>
                        <ul class="text-sm text-gray-300 space-y-3 font-light">

                            <div class="lang-ar space-y-3">${scopeArHTML}</div>
                        </ul>
                    </div>
                </div>

                <!-- Navigation Action -->
                <div class="flex justify-between items-center pt-4 border-t border-white/10">
                    <a href="portfolio.html" class="glass-card px-6 py-3 rounded-full text-sm font-bold text-amber-400 hover:bg-amber-500/20 transition flex items-center gap-2">

                    </a>
                </div>
            `;
        }

        function changeMainImage(src) {
            const mainImg = document.getElementById('main-display-img');
            if (mainImg) {
                mainImg.src = src;
            }
        }

        function toggleLanguage() {
            const htmlTag = document.getElementById('main-html');
            const btnText = document.getElementById('lang-btn-text');
            if (htmlTag.getAttribute('lang') === 'en') {
                htmlTag.setAttribute('lang', 'ar');
                htmlTag.setAttribute('dir', 'rtl');
                btnText.textContent = 'English';
                localStorage.setItem('scdc_lang', 'ar');
            } else {
                htmlTag.setAttribute('lang', 'en');
                htmlTag.setAttribute('dir', 'ltr');
                btnText.textContent = 'العربية';
                localStorage.setItem('scdc_lang', 'en');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('scdc_lang');
            if (savedLang === 'ar') {
                const htmlTag = document.getElementById('main-html');
                htmlTag.setAttribute('lang', 'ar');
                htmlTag.setAttribute('dir', 'rtl');
                document.getElementById('lang-btn-text').textContent = 'English';
            }
            renderProject();
        });
