<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth" id="main-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Project Details | Sketchy Chapters</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Tajawal:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', 'Tajawal', sans-serif;
            background-color: #08080a;
            color: #e0e6ed;
        }
        .gold-accent { color: #d4af37; }
        .gold-gradient-text {
            background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .bg-gold { background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%); }
        .glass-card {
            background: rgba(18, 18, 22, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.15);
        }
        [lang="ar"] .lang-en { display: none !important; }
        [lang="en"] .lang-ar { display: none !important; }
    </style>
</head>
<body class="selection:bg-amber-500 selection:text-black min-h-screen flex flex-col justify-between">

    <!-- Header Navigation -->
    <nav class="fixed w-full z-50 glass-card px-6 py-4 flex justify-between items-center top-0 border-b border-amber-500/15">
        <a href="index.html" class="flex items-center space-x-3 rtl:space-x-reverse">
            <span class="text-xl font-black tracking-wider text-white">SKETCHY <span class="gold-accent">CHAPTERS</span></span>
        </a>

        <div class="flex items-center space-x-4 rtl:space-x-reverse">
            <button onclick="toggleLanguage()" class="glass-card px-3.5 py-1.5 rounded-full text-xs font-bold text-amber-400 border border-amber-500/30 hover:bg-amber-500/20 transition flex items-center gap-1.5">
                <i class="fa-solid fa-globe"></i>
                <span id="lang-btn-text">العربية</span>
            </button>
            <a href="portfolio.html" class="bg-gold text-black px-5 py-2 rounded-full font-bold text-xs uppercase tracking-wider hover:brightness-110 transition">
                <span class="lang-en">← Back to Portfolio</span>
                <span class="lang-ar">العودة للمعرض ←</span>
            </a>
        </div>
    </nav>

    <!-- Main Content Dynamic Container -->
    <main class="pt-32 pb-20 px-6 max-w-5xl mx-auto w-full flex-grow">
        <div id="project-container">
            <!-- Project content gets rendered dynamically -->
        </div>
    </main>

    <footer class="py-8 text-center text-xs text-gray-500 border-t border-amber-500/10">
        <p>&copy; 2026 Sketchy Chapters Design & Construction (SCDC). All Rights Reserved.</p>
    </footer>

    <script>
        const projectsData = {
            'beirut-villa': {
                titleEn: 'Luxury Living Room & Kitchen Villa',
                titleAr: 'فيلا الفخامة - غرفة المعيشة والمطبخ',
                locationEn: 'Downtown Beirut (2024)',
                locationAr: 'وسط بيروت (٢٠٢٤)',
                image: 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1200',
                descEn: 'Complete architectural layout and high-end interior execution featuring custom woodwork and integrated lighting design for a luxury residential villa located in Downtown Beirut.',
                descAr: 'تصميم معماري وتنفيذ داخلي راقٍ يتضمن تفاصيل خشبية مخصصة ونظام إضاءة مدروس لفيلا سكنية فاخرة في منطقة وسط بيروت.'
            },
            'rosaline-salon': {
                titleEn: 'Beauty By Rosaline Makeup Salon',
                titleAr: 'صالون بيوتي باي روزالين للتجميل',
                locationEn: 'Tripoli, Lebanon (2023)',
                locationAr: 'طرابلس، لبنان (٢٠٢٣)',
                image: 'Rosaline-Salon-Render-1.jpg',
                fallbackImg: 'https://images.unsplash.com/photo-1560066984-138dadb4c035?q=80&w=1200',
                descEn: 'Bespoke commercial interior design optimized for high customer experience, styling stations, and luxury aesthetics built in Tripoli, Lebanon.',
                descAr: 'تصميم داخلي تجاري مخصص يركز على تقديم أفضل تجربة للزبائن، محطات تصفيف وتجميل، وجماليات راقية في مدينة طرابلس.'
            },
            'office-berlin': {
                titleEn: 'Office Berline Workspace Interior',
                titleAr: 'تصميم مكتب برلين للأعمال',
                locationEn: 'Berlin, Germany (2023)',
                locationAr: 'برلين، ألمانيا (٢٠٢٣)',
                image: 'Office-Berlin-1.jpg',
                fallbackImg: 'https://images.unsplash.com/photo-1497215728101-856f4ea42174?q=80&w=1200',
                descEn: 'Modern corporate workspace interior prioritizing acoustic balance, minimalist ergonomics, and executive meeting rooms located in Berlin, Germany.',
                descAr: 'مساحة عمل مؤسسية حديثة تركز على التوازن الصوتي، الراحة العملية، وغرف الاجتماعات التنفيذية في برلين.'
            },
            'arz-villa': {
                titleEn: 'Mountain Villa Salon & Dining Area',
                titleAr: 'صالون ومنطقة طعام فيلا الأرز الجبلية',
                locationEn: 'Arz, Lebanon (2025)',
                locationAr: 'الأرز، لبنان (٢٠٢٥)',
                image: 'https://images.unsplash.com/photo-1600566753376-12c8ab7fb75b?q=80&w=1200',
                descEn: 'Warm mountain aesthetic combining natural stone finishes, expansive glazing frames, and grand social dining spaces completed in Arz, Lebanon.',
                descAr: 'طابع جبلي دافئ يدمج اللمسات الحجرية الطبيعية، الواجهات الزجاجية الواسعة، ومناطق الطعام العائلية في منطقة الأرز.'
            },
            'dermexcel': {
                titleEn: 'Dermexcel Commercial Display Stand',
                titleAr: 'منصة عرض ديرمكسيل التجارية',
                locationEn: 'Akkar, Lebanon (2024)',
                locationAr: 'عكار، لبنان (٢٠٢٤)',
                image: 'https://images.unsplash.com/photo-1555529771-835f59fc5efe?q=80&w=1200',
                descEn: 'Custom branded display stand engineering emphasizing product visibility, clean clinical aesthetics, and modular structure in Akkar, Lebanon.',
                descAr: 'تصميم وتنفيذ منصة عرض تجارية تبرز هوية المنتج بطابع نظيف وهيكلية مرنة وسهلة الفك والتركيب في عكار.'
            },
            'tripoli-partition': {
                titleEn: 'Entrance Partition & TV Unit Fabrication',
                titleAr: 'فاصل المدخل الخشبي ووحدة التلفاز',
                locationEn: 'Tripoli, Lebanon (2025)',
                locationAr: 'طرابلس، لبنان (٢٠٢٥)',
                image: 'https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?q=80&w=1200',
                descEn: 'Custom carpentry fabrication integrating wooden vertical laths, concealed LED lighting strips, and functional media unit located in Tripoli, Lebanon.',
                descAr: 'تصميم وتنفيذ أعمال نجارة مخصصة، عوارض خشبية شاقولية، إضاءة مخفية LED، ووحدة تلفاز عملية ومميزة في طرابلس.'
            }
        };

        function renderProject() {
            const params = new URLSearchParams(window.location.search);
            const projectId = params.get('id');
            const data = projectsData[projectId] || projectsData['beirut-villa'];

            const container = document.getElementById('project-container');
            const imgSrc = data.image;

            container.innerHTML = `
                <div class="inline-block px-4 py-1.5 rounded-full glass-card text-xs font-bold gold-accent mb-6 uppercase tracking-widest border border-amber-500/30">
                    <span class="lang-en">${data.locationEn}</span>
                    <span class="lang-ar">${data.locationAr}</span>
                </div>
                <h1 class="text-3xl md:text-5xl font-black text-white mb-8">
                    <span class="lang-en">${data.titleEn}</span>
                    <span class="lang-ar">${data.titleAr}</span>
                </h1>
                
                <div class="rounded-3xl overflow-hidden mb-10 border border-amber-500/20 shadow-2xl h-[400px] md:h-[550px]">
                    <img src="${imgSrc}" alt="${data.titleEn}" class="w-full h-full object-cover" onerror="this.src='${data.fallbackImg || imgSrc}'">
                </div>

                <div class="glass-card rounded-3xl p-8 md:p-10 mb-8">
                    <h3 class="text-xl font-bold text-amber-400 mb-4">
                        <span class="lang-en">Project Description</span>
                        <span class="lang-ar">تفاصيل المشروع</span>
                    </h3>
                    <p class="text-gray-300 font-light leading-relaxed text-base md:text-lg">
                        <span class="lang-en">${data.descEn}</span>
                        <span class="lang-ar">${data.descAr}</span>
                    </p>
                </div>

                <div class="flex justify-between items-center pt-4">
                    <a href="portfolio.html" class="glass-card px-6 py-3 rounded-full text-sm font-bold text-amber-400 hover:bg-amber-500/20 transition flex items-center gap-2">
                        <i class="fa-solid fa-arrow-left"></i>
                        <span class="lang-en">Back to all projects</span>
                        <span class="lang-ar">الرجوع إلى كافّة المشاريع</span>
                    </a>
                </div>
            `;
        }

        function toggleLanguage() {
            const htmlTag = document.getElementById('main-html');
            const btnText = document.getElementById('lang-btn-text');
            if (htmlTag.getAttribute('lang') === 'en') {
                htmlTag.setAttribute('lang', 'ar');
                htmlTag.setAttribute('dir', 'rtl');
                btnText.textContent = 'English';
                localStorage.setItem('scdc_lang', 'ar');
            } else {
                htmlTag.setAttribute('lang', 'en');
                htmlTag.setAttribute('dir', 'ltr');
                btnText.textContent = 'العربية';
                localStorage.setItem('scdc_lang', 'en');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('scdc_lang');
            if (savedLang === 'ar') {
                const htmlTag = document.getElementById('main-html');
                htmlTag.setAttribute('lang', 'ar');
                htmlTag.setAttribute('dir', 'rtl');
                document.getElementById('lang-btn-text').textContent = 'English';
            }
            renderProject();
        });
    </script>
</body>
</html>
