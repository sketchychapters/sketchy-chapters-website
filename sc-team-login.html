<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Sketchy Chapters</title>
<link rel="icon" type="image/png" href="favicon w.png">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<style>
  body{font-family:'Tajawal',sans-serif;background:#08080a;color:#e0e6ed;}
  .gold-accent{color:#d4af37;}
  .bg-gold{background:linear-gradient(135deg,#d4af37 0%,#aa7c11 100%);}
  .glass-card{background:rgba(18,18,22,.65);backdrop-filter:blur(16px);border:1px solid rgba(212,175,55,.15);}
  input{background:rgba(0,0,0,.4);border:1px solid rgba(212,175,55,.25);}
  input:focus{outline:none;border-color:#d4af37;}
</style>
</head>
<body class="min-h-screen flex items-center justify-center px-6">

<div class="glass-card w-full max-w-sm rounded-3xl p-8 md:p-10">
  <div class="text-center mb-8">
    <i class="fa-solid fa-lock gold-accent text-2xl mb-3"></i>
    <h1 class="text-xl font-black text-white mb-1">Admin Access</h1>
    <p class="text-gray-400 text-xs">Sketchy Chapters Workshop Center</p>
  </div>

  <form id="adminLoginForm" class="space-y-4">
    <input id="email" type="email" placeholder="Admin Email" required
      class="w-full rounded-xl px-4 py-3 text-sm text-white">
    <input id="password" type="password" placeholder="Password" required
      class="w-full rounded-xl px-4 py-3 text-sm text-white">

    <p id="errorMsg" class="text-red-400 text-xs hidden"></p>

    <button type="submit" class="w-full bg-gold text-black font-black py-3 rounded-xl text-sm hover:opacity-90 transition">
      Enter Dashboard
    </button>
  </form>
</div>

<script src="firebase-init.js"></script>
<script>
document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('errorMsg');
  errorEl.classList.add('hidden');

  try {
    await loginAdmin(
      document.getElementById('email').value,
      document.getElementById('password').value
    );
    window.location.href = 'sc-team-dashboard.html';
  } catch (err) {
    errorEl.textContent = 'Access denied. Check your admin credentials.';
    errorEl.classList.remove('hidden');
  }
});
</script>
</body>
</html>
