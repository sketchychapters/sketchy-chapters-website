<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-ar="مكتبة الفيديو | Sketchy Chapters" data-en="Video Library | Sketchy Chapters">Video Library | Sketchy Chapters</title>
<link rel="icon" type="image/png" href="favicon w.png">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body{color-scheme:dark;font-family:'Tajawal',sans-serif;background:#08080a;color:#e0e6ed;overflow-x:hidden;}
  .gold-accent{color:#d4af37;}
  .bg-gold{background:linear-gradient(135deg,#d4af37 0%,#aa7c11 100%);}
  .glass-card{background:rgba(18,18,22,.6);backdrop-filter:blur(16px);border:1px solid rgba(212,175,55,.15);transition:all .3s ease;}
  .glass-card:hover{border-color:rgba(212,175,55,.5);box-shadow:0 10px 30px -10px rgba(212,175,55,.2);}
  input{background:rgba(0,0,0,.4);border:1px solid rgba(212,175,55,.25);color:#fff;}
  input:focus{outline:none;border-color:#d4af37;}
  [lang="ar"] .lang-en{display:none!important;}
  [lang="en"] .lang-ar{display:none!important;}
  .video-thumb{aspect-ratio:16/9;background-size:cover;background-position:center;}
  .skeleton{background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.08) 37%,rgba(255,255,255,.04) 63%);background-size:400% 100%;animation:skeletonShine 1.4s ease infinite;}
  @keyframes skeletonShine{0%{background-position:100% 50%;}100%{background-position:0 50%;}}
</style>
</head>
<body class="min-h-screen">

<header class="glass-card fixed top-0 w-full z-50 border-b border-amber-500/15 py-4 px-6 md:px-12 flex items-center justify-between">
  <a href="workshop.html" class="flex items-center space-x-3 rtl:space-x-reverse">
    <img src="workshop.png" alt="Workshop Logo" class="h-10 w-auto object-contain" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';">
    <span id="logo-fallback" class="hidden text-lg font-black tracking-wider text-white">SKETCHY <span class="gold-accent">CHAPTERS</span></span>
  </a>
  <a href="workshop.html" class="glass-card text-amber-400 border border-amber-500/30 px-4 py-2 rounded-xl text-xs font-bold hover:bg-amber-500/10 transition flex items-center gap-2">
    <i class="fa-solid fa-arrow-left rtl:rotate-180 text-sm"></i>
    <span data-ar="الرجوع للدورات" data-en="Back to Workshops">Back to Workshops</span>
  </a>
  <button onclick="toggleLanguage()" id="lang-btn" class="glass-card text-amber-400 border border-amber-500/30 px-3 py-2 rounded-xl text-xs font-bold hover:bg-amber-500/10 transition flex items-center gap-1.5">
    <i class="fa-solid fa-globe text-sm"></i>
    <span id="langBtnText">العربية</span>
  </button>
</header>

<main class="max-w-6xl mx-auto px-6 pt-32 pb-20">

  <div class="text-center mb-10">
    <div class="inline-block px-4 py-1.5 rounded-full glass-card text-xs font-bold gold-accent mb-4 uppercase tracking-widest border border-amber-500/30">
       <span data-ar="محتوى تعليمي مجاني" data-en="Free Educational Content">Free Educational Content</span>
    </div>
    <h1 class="text-3xl md:text-5xl font-black text-white mb-3" data-ar="مكتبة الفيديو" data-en="Video Library">Video Library</h1>
    <p class="text-gray-400 text-sm md:text-base font-light max-w-xl mx-auto" data-ar="ابحث عن أي موضوع من فيديوهاتنا التعليمية على يوتيوب وشاهده مباشرة من هون." data-en="Search any topic from our YouTube educational videos and watch it right here.">Search any topic from our YouTube educational videos and watch it right here.</p>
  </div>

  <div class="relative max-w-xl mx-auto mb-10">
    <i class="fa-solid fa-magnifying-glass absolute top-1/2 -translate-y-1/2 left-4 rtl:left-auto rtl:right-4 text-gray-500"></i>
    <input id="searchInput" type="text" placeholder="Search videos... e.g. AutoCAD, Revit, rendering"
      data-ar-placeholder="ابحث عن فيديو... مثلاً أوتوكاد، ريفيت، رندر"
      class="w-full rounded-2xl pl-12 rtl:pl-4 rtl:pr-12 pr-4 py-4 text-sm text-white">
  </div>

  <p id="resultsCount" class="text-center text-gray-500 text-xs mb-6"></p>

  <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>

  <div id="loadingState" class="text-center py-20">
    <i class="fa-solid fa-spinner fa-spin text-3xl gold-accent mb-4"></i>
    <p class="text-gray-400 text-sm" data-ar="جاري تحميل الفيديوهات..." data-en="Loading videos...">Loading videos...</p>
  </div>

  <div id="errorState" class="hidden text-center py-20">
    <i class="fa-solid fa-triangle-exclamation text-3xl text-red-400 mb-4"></i>
    <p class="text-gray-400 text-sm" data-ar="تعذّر تحميل الفيديوهات. حاول مرة أخرى لاحقاً." data-en="Could not load videos. Please try again later.">Could not load videos. Please try again later.</p>
  </div>

  <div id="emptyState" class="hidden text-center py-20">
    <i class="fa-solid fa-video-slash text-3xl text-gray-600 mb-4"></i>
    <p class="text-gray-400 text-sm" data-ar="ما لقينا أي فيديو يطابق بحثك." data-en="No videos match your search.">No videos match your search.</p>
  </div>

</main>

<!-- Video Player Modal -->
<div id="playerModal" class="hidden fixed inset-0 bg-black/90 z-[70] items-center justify-center px-4">
  <div class="w-full max-w-4xl">
    <div class="flex justify-end mb-3">
      <button onclick="closePlayer()" class="w-10 h-10 rounded-full bg-black/60 border border-amber-500/30 text-amber-400 hover:bg-amber-500/20 transition">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="relative rounded-2xl overflow-hidden shadow-2xl" style="aspect-ratio:16/9;">
      <iframe id="playerFrame" class="w-full h-full" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
    <p id="playerTitle" class="text-white font-bold text-sm mt-4 text-center"></p>
  </div>
</div>

<footer class="py-10 text-center text-gray-600 text-[11px] border-t border-gray-900">
  <span data-ar="© 2026 مركز ورش عمل سكتشي تشابترز" data-en="© 2026 Sketchy Chapters Workshop Center">© 2026 Sketchy Chapters Workshop Center</span>
</footer>

<script>
// ==========================================================
// إعدادات قناة اليوتيوب — بنجيب كل الفيديوهات مرة وحدة ونخزّنها،
// والبحث بعدها محلي بالكامل (بدون أي استهلاك إضافي لحصة الـ API)
// ==========================================================
const YT_API_KEY = 'AIzaSyBBFIZHSVikZ3eQdjB9xBsUJIQVhH1FBD4';
const CHANNEL_HANDLE = '@workshopcenter';
const CACHE_KEY = 'sketchy_video_cache_v1';
const CACHE_HOURS = 12;

let allVideos = [];

async function getUploadsPlaylistId() {
  const url = `https://www.googleapis.com/youtube/v3/channels?part=contentDetails&forHandle=${encodeURIComponent(CHANNEL_HANDLE)}&key=${YT_API_KEY}`;
  const res = await fetch(url);
  const data = await res.json();
  if (!data.items || data.items.length === 0) throw new Error('Channel not found');
  return data.items[0].contentDetails.relatedPlaylists.uploads;
}

async function fetchAllVideos(playlistId) {
  let videos = [];
  let pageToken = '';
  do {
    const url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=${playlistId}&pageToken=${pageToken}&key=${YT_API_KEY}`;
    const res = await fetch(url);
    const data = await res.json();
    if (data.items) {
      videos = videos.concat(data.items
        .filter(item => item.snippet && item.snippet.resourceId && item.snippet.title !== 'Private video' && item.snippet.title !== 'Deleted video')
        .map(item => ({
          id: item.snippet.resourceId.videoId,
          title: item.snippet.title,
          description: item.snippet.description || '',
          thumbnail: (item.snippet.thumbnails && (item.snippet.thumbnails.medium || item.snippet.thumbnails.default) || {}).url || '',
          publishedAt: item.snippet.publishedAt
        })));
    }
    pageToken = data.nextPageToken || '';
  } while (pageToken);
  return videos;
}

async function loadVideos() {
  try {
    const cached = localStorage.getItem(CACHE_KEY);
    if (cached) {
      const parsed = JSON.parse(cached);
      const ageHours = (Date.now() - parsed.timestamp) / (1000 * 60 * 60);
      if (ageHours < CACHE_HOURS && parsed.videos && parsed.videos.length > 0) {
        allVideos = parsed.videos;
        renderVideos(allVideos);
        document.getElementById('loadingState').classList.add('hidden');
        return;
      }
    }

    const playlistId = await getUploadsPlaylistId();
    const videos = await fetchAllVideos(playlistId);
    videos.sort((a, b) => new Date(b.publishedAt) - new Date(a.publishedAt));

    allVideos = videos;
    localStorage.setItem(CACHE_KEY, JSON.stringify({ videos, timestamp: Date.now() }));

    document.getElementById('loadingState').classList.add('hidden');
    renderVideos(allVideos);
  } catch (err) {
    console.error('Failed to load videos:', err);
    document.getElementById('loadingState').classList.add('hidden');
    document.getElementById('errorState').classList.remove('hidden');
  }
}

function renderVideos(videos) {
  const grid = document.getElementById('videoGrid');
  const emptyState = document.getElementById('emptyState');
  const resultsCount = document.getElementById('resultsCount');
  const isAr = document.documentElement.getAttribute('lang') === 'ar';

  if (videos.length === 0) {
    grid.innerHTML = '';
    emptyState.classList.remove('hidden');
    resultsCount.textContent = '';
    return;
  }
  emptyState.classList.add('hidden');

  resultsCount.textContent = isAr ? `${videos.length} فيديو` : `${videos.length} video${videos.length !== 1 ? 's' : ''}`;

  grid.innerHTML = videos.map(v => `
    <div onclick="openPlayer('${v.id}', ${JSON.stringify(v.title).replace(/"/g, '&quot;')})" class="glass-card rounded-2xl overflow-hidden cursor-pointer group">
      <div class="video-thumb relative" style="background-image:url('${v.thumbnail}');">
        <div class="absolute inset-0 bg-black/20 group-hover:bg-black/40 transition flex items-center justify-center">
          <div class="w-12 h-12 rounded-full bg-gold flex items-center justify-center opacity-90 group-hover:scale-110 transition">
            <i class="fa-solid fa-play text-black text-sm ms-0.5"></i>
          </div>
        </div>
      </div>
      <div class="p-4">
        <p class="text-white text-sm font-bold leading-snug line-clamp-2">${escapeHtml(v.title)}</p>
      </div>
    </div>
  `).join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function openPlayer(videoId, title) {
  document.getElementById('playerFrame').src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
  document.getElementById('playerTitle').textContent = title;
  const modal = document.getElementById('playerModal');
  modal.classList.remove('hidden');
  modal.classList.add('flex');
  document.body.style.overflow = 'hidden';
}

function closePlayer() {
  document.getElementById('playerFrame').src = '';
  const modal = document.getElementById('playerModal');
  modal.classList.add('hidden');
  modal.classList.remove('flex');
  document.body.style.overflow = '';
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  const query = e.target.value.trim().toLowerCase();
  if (!query) {
    renderVideos(allVideos);
    return;
  }
  const filtered = allVideos.filter(v =>
    v.title.toLowerCase().includes(query) || v.description.toLowerCase().includes(query)
  );
  renderVideos(filtered);
});

let currentLang = 'en';
function toggleLanguage() {
  currentLang = currentLang === 'en' ? 'ar' : 'en';
  const htmlRoot = document.getElementById('htmlRoot');
  const langBtnText = document.getElementById('langBtnText');
  const searchInput = document.getElementById('searchInput');
  htmlRoot.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
  htmlRoot.setAttribute('lang', currentLang);
  langBtnText.innerText = currentLang === 'ar' ? 'English' : 'العربية';

  document.querySelectorAll('[data-ar]').forEach(el => {
    const t = currentLang === 'ar' ? el.getAttribute('data-ar') : el.getAttribute('data-en');
    if (t) el.innerText = t;
  });

  searchInput.placeholder = currentLang === 'ar'
    ? searchInput.getAttribute('data-ar-placeholder')
    : 'Search videos... e.g. AutoCAD, Revit, rendering';

  renderVideos(allVideos.length && searchInput.value.trim()
    ? allVideos.filter(v => v.title.toLowerCase().includes(searchInput.value.trim().toLowerCase()))
    : allVideos);
}

loadVideos();
</script>
</body>
</html>
