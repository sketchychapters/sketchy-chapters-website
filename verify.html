<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>التحقق من صحة الشهادة | Sketchy Chapters - Workshop Center</title>
<link rel="icon" type="image/png" href="favicon w.png">
<style>
  :root {
    --gold: #C9962E;
    --gold-dark: #8F5F0E;
    --bg: #171310;
    --card-bg: #211b16;
    --text: #f2ede6;
    --muted: #b8ada0;
    --green: #3fb950;
    --red: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: var(--card-bg);
    border: 1px solid rgba(201, 150, 46, 0.25);
    border-radius: 16px;
    padding: 32px 28px;
    position: relative;
  }
  #langBtn {
    position: absolute;
    top: 20px;
    inset-inline-end: 20px;
    width: auto;
    margin-top: 0;
    padding: 6px 12px;
    border-radius: 20px;
    background: rgba(201, 150, 46, 0.12);
    border: 1px solid rgba(201, 150, 46, 0.35);
    color: var(--gold);
    font-size: 0.75rem;
    font-weight: bold;
    cursor: pointer;
  }
  #langBtn:hover { background: rgba(201, 150, 46, 0.22); }
  h1 {
    font-size: 1.3rem;
    margin: 0 0 6px;
    color: var(--gold);
    text-align: center;
  }
  p.subtitle {
    text-align: center;
    color: var(--muted);
    margin: 0 0 24px;
    font-size: 0.9rem;
  }
  label {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.15);
    background: #0f0c09;
    color: var(--text);
    font-size: 1rem;
    letter-spacing: 1px;
    text-align: center;
    direction: ltr;
  }
  input[type="text"]:focus { outline: 2px solid var(--gold); border-color: var(--gold); }
  button {
    width: 100%;
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    color: #171310;
    font-weight: bold;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #result { margin-top: 24px; }
  .result-box {
    border-radius: 12px;
    padding: 18px;
    font-size: 0.95rem;
    line-height: 1.9;
  }
  .valid { background: rgba(63, 185, 80, 0.12); border: 1px solid rgba(63, 185, 80, 0.4); }
  .invalid { background: rgba(248, 81, 73, 0.12); border: 1px solid rgba(248, 81, 73, 0.4); }
  .status-line { font-weight: bold; margin-bottom: 8px; }
  .valid .status-line { color: var(--green); }
  .invalid .status-line { color: var(--red); }
  .row { display: flex; justify-content: space-between; gap: 12px; }
  .row .k { color: var(--muted); }
  .row .v { font-weight: 600; text-align: left; direction: ltr; }
  footer {
    text-align: center;
    margin-top: 24px;
    color: var(--muted);
    font-size: 0.75rem;
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    background: #0f0c09;
    border-radius: 10px;
    padding: 4px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 9px 6px;
    border-radius: 8px;
    font-size: 0.8rem;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  .tab.tab-active {
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    color: #171310;
    font-weight: bold;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="card">
    <button id="langBtn" type="button">English</button>

    <h1 data-ar="التحقق من صحة الشهادة" data-en="Certificate Verification">التحقق من صحة الشهادة</h1>
    <p class="subtitle">Sketchy Chapters &middot; Workshop Center</p>

    <div class="tabs">
      <div id="tabCode" class="tab tab-active" data-ar="لدي رمز التحقق" data-en="I Have a Verification Code">لدي رمز التحقق</div>
      <div id="tabLegacy" class="tab" data-ar="شهادة قديمة (بدون رمز)" data-en="Older Certificate (No Code)">شهادة قديمة (بدون رمز)</div>
    </div>

    <div id="codeSection">
      <label for="certInput" data-ar="الرجاء إدخال رمز التحقق الخاص بالشهادة" data-en="Please enter your certificate's verification code">الرجاء إدخال رمز التحقق الخاص بالشهادة</label>
      <input type="text" id="certInput" placeholder="SCWC-XXXX-XXXX" autocomplete="off" />
      <button id="checkBtn" data-ar="تحقّق" data-en="Verify">تحقّق</button>
    </div>

    <div id="legacySection" hidden>
      <label for="legacyName" data-ar="الاسم كما هو مكتوب على الشهادة" data-en="Name as written on the certificate">الاسم كما هو مكتوب على الشهادة</label>
      <input type="text" id="legacyName" autocomplete="off" style="direction: rtl; letter-spacing: normal;" />
      <label for="legacyStudentNumber" style="margin-top: 14px;" data-ar="رقم الهاتف الذي سجّلت فيه" data-en="Phone Number Used at Registration">رقم الهاتف الذي سجّلت فيه</label>
      <input type="tel" id="legacyStudentNumber" autocomplete="off" />
      <label for="legacyCourseName" style="margin-top: 14px;" data-ar="اسم الدورة" data-en="Course Name">اسم الدورة</label>
      <input type="text" id="legacyCourseName" autocomplete="off" style="direction: rtl; letter-spacing: normal;" />
      <button id="legacyCheckBtn" data-ar="تحقّق" data-en="Verify">تحقّق</button>
    </div>

    <div id="result"></div>

    <footer data-ar="يوجد رمز التحقق على الشهادة الأصلية، ويمكن الوصول لهذه الصفحة مباشرة عبر مسح رمز الاستجابة السريعة الموجود عليها. أما الشهادات القديمة فيمكن التحقق منها بإدخال الاسم ورقم الهاتف واسم الدورة." data-en="The verification code appears on the original certificate, and this page can be reached directly by scanning the QR code on it. Older certificates can be verified by entering the name, phone number, and course name.">يوجد رمز التحقق على الشهادة الأصلية، ويمكن الوصول لهذه الصفحة مباشرة عبر مسح رمز الاستجابة السريعة الموجود عليها. أما الشهادات القديمة فيمكن التحقق منها بإدخال الاسم ورقم الهاتف واسم الدورة.</footer>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/verify.js"></script>
</body>
</html>
