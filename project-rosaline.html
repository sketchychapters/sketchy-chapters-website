<!DOCTYPE html>

<body class="pt-24" oncontextmenu="return false;">

    <nav class="fixed w-full z-50 glass-card px-6 py-4 flex justify-between items-center top-0 border-b border-amber-500/10">

    <section class="py-12 px-6 max-w-7xl mx-auto">
