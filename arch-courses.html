<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sketchy Chapters - Architecture Courses</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 30px;
        }
        .courses-pricing-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }
        .course-item {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            text-align: center;
            transition: transform 0.2s ease;
        }
        .course-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .course-item h3 {
            margin: 0 0 15px 0;
            font-size: 18px;
            color: #334155;
        }
        .price {
            font-size: 20px;
            font-weight: bold;
            margin: 0;
        }
        .old-price {
            text-decoration: line-through;
            color: #94a3b8;
            font-size: 16px;
            margin-right: 10px;
        }
        .new-price {
            color: #0d9488;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Architecture Courses & Training Programs</h1>
    
    <!-- Courses Section Pricing Update -->
    <div class="courses-pricing-container">
        <div class="course-item">
            <h3>AutoCAD</h3>
            <p class="price"><span class="old-price">$270</span> <span class="new-price">$216</span></p>
        </div>
        <div class="course-item">
            <h3>Revit 1</h3>
            <p class="price"><span class="old-price">$270</span> <span class="new-price">$216</span></p>
        </div>
        <div class="course-item">
            <h3>Revit 2 + V-Ray</h3>
            <p class="price"><span class="old-price">$270</span> <span class="new-price">$216</span></p>
        </div>
        <div class="course-item">
            <h3>Photoshop</h3>
            <p class="price"><span class="old-price">$120</span> <span class="new-price">$96</span></p>
        </div>
        <div class="course-item">
            <h3>Lumion</h3>
            <p class="price"><span class="old-price">$120</span> <span class="new-price">$96</span></p>
        </div>
    </div>
</div>

</body>
</html>
